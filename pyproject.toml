[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-torrenter"
dynamic = ["version"]
description = "An interactive terminal torrent client built on libtorrent and Textual."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Romain Hedouin" }]
keywords = ["torrent", "libtorrent", "tui", "textual", "bittorrent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "libtorrent>=2.0.0",
    "textual>=8.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
terminal-torrenter = "terminal_torrenter.tui:main"
tt = "terminal_torrenter.tui:main"

[project.urls]
Homepage = "https://github.com/romainhedouin/terminal-torrenter"
Issues = "https://github.com/romainhedouin/terminal-torrenter/issues"

[tool.hatch.version]
path = "src/terminal_torrenter/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
